[package]
name = "mcpg-plugin-backend-llm-compat"
version = "0.1.0-alpha.20"
license = "Apache-2.0"
edition = "2024"
description = """
OpenAI-compatible chat-completion binding plugin for MCPG.

Ships `CompatChatPlugin` (kind: `compat.chat`) for any endpoint that
speaks the OpenAI `/chat/completions` ABI: vLLM, LocalAI, Together,
Groq, OpenRouter, llama.cpp's OpenAI server, Vertex AI's OpenAI
compatibility surface, and others.

Reuses `OpenAiAdapter` (with `OpenAiVariant::Compatible`) from the
sibling `mcpg-plugin-backend-llm-openai` crate. Operator MUST declare
`base_url`; `api_key` is optional because some self-hosted endpoints
accept any/no key.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: keeps the
# in-tree unit tests + the gateway's current static path
# (CompatChatPlugin::new in app/mod.rs) building. The
# backend-plugin-migration adds the cdylib surface additively; the
# gateway stays on the static path for now.
crate-type = ["cdylib", "rlib"]

[features]
# Default OFF so the workspace build (which links the gateway bin
# against this crate as an rlib) does not emit `mcpg_plugin_register`
# and collide with the other plugin rlibs. Standalone cdylib builds
# (nx docker:build / OCI publish) opt in via `--features cdylib-export`.
default = []
cdylib-export = []
# Declared empty so the SDK macro's `register_static` accessor
# (`#[cfg(feature = "static-firstparty")]`) stays gated OFF here and
# does not trip `unexpected_cfgs`. The crate is consumed via the
# gateway's own manual registration block today, NOT through the SDK
# macro's static-firstparty path. (Note: the SDK *dependency* below
# still enables its own `static-firstparty` feature — that is a
# separate flag gating the SDK's `plugin_host` re-export, not this
# crate's `register_static` emission.)
static-firstparty = []

[dependencies]
tokio-util = "0.7"
mcpg-backend-llm-shared = { git = "https://github.com/mcpg-dev/mcpg-backend-llm-shared", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-sensitive = { git = "https://github.com/mcpg-dev/mcpg-sensitive", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-backend-llm-openai = { git = "https://github.com/mcpg-dev/mcpg-plugin-backend-llm-openai", tag = "v0.1.0-alpha.20", version = "=0.1.0-alpha.20" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18", features = ["static-firstparty"] }
async-trait = "0.1"
futures = "0.3"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt-multi-thread` powers the cdylib sync bridge's private runtime
# (`Builder::new_multi_thread`); the rest cover the async adapter logic
# shared with the static path.
tokio = { version = "1", features = [
  "sync",
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
