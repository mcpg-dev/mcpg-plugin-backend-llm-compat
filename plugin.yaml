schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.llm.compat
name: OpenAI-Compatible Backends
license: Apache-2.0
description: |
  Cdylib descriptor for the OpenAI-compatible backend plugins. Ships
  two `backend` entities under one cdylib (chat, embedding) for any
  endpoint that speaks the OpenAI `/chat/completions` and
  `/embeddings` ABIs but is not OpenAI itself: vLLM, LocalAI,
  Together, Groq, OpenRouter, llama.cpp's OpenAI server, Vertex AI's
  OpenAI compatibility surface, and others. Each entity self-describes
  its real kind (`compat.chat`, `compat.embedding`) at runtime via its
  `manifest()` slot, so the host dispatches to the right binding.

  The static-firstparty path keeps using the per-kind `plugin.*.yaml`
  descriptors + the gateway's manual registration block; this single
  descriptor is for the native-cdylib loader only.
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
